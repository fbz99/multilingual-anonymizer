<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anonimizzatore</title>
  <style>
    /* Navbar in alto */
    nav {
      background-color: #333;
      color: #fff;
      padding: 10px;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      margin-right: 20px;
    }
    nav a:hover {
      text-decoration: underline;
    }

    /* Layout principale a due colonne */
    #container {
      display: flex;
      height: 80vh;
    }

    /* Colonna sinistra */
    #left {
      width: 50%;
      border: 2px dashed #999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Box drag & drop */
    #dropZone {
      width: 80%;
      height: 200px;
      border: 2px dashed #aaa;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #666;
      margin-bottom: 10px;
    }
    #dropZone.hover {
      background-color: #eee;
    }

    /* Pulsante invisibile per file */
    #fileInput {
      display: none; 
    }

    /* Colonna destra */
    #right {
      width: 50%;
      border: 1px solid #ccc;
      padding: 20px;
      overflow-y: auto;
    }
    #anonText {
      white-space: pre-wrap; /* Mantiene i ritorni a capo */
    }
  </style>
</head>
<body>

  <!-- NAVBAR in alto -->
  <nav>
    <a href="index.html">Anonymize</a>
    <a href="deanonymize.html">De-anonymize</a>
  </nav>

  <h1>Anonimizzazione</h1>
  <div id="container">
    <!-- Colonna Sinistra -->
    <div id="left">
      <div id="dropZone">Trascina il file qui</div>
      <p>Oppure</p>
      <button id="selectFileBtn">Seleziona File...</button>
      <input type="file" id="fileInput" accept=".pdf,.docx,.xlsx,.txt" />
      <br />
      <button id="anonimizzaBtn">Anonimizza</button>
    </div>

    <!-- Colonna Destra -->
    <div id="right">
      <h3>Testo Anonimizzato:</h3>
      <div id="anonText"></div>
    </div>
  </div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    let selectedFile = null;

    $(document).ready(function () {
      const dropZone = $("#dropZone");
      const fileInput = $("#fileInput");

      // Gestione del DRAG & DROP
      dropZone.on("dragenter", function(e) {
        e.preventDefault();
        e.stopPropagation();
        dropZone.addClass("hover");
      });
      dropZone.on("dragleave", function(e) {
        e.preventDefault();
        e.stopPropagation();
        dropZone.removeClass("hover");
      });
      dropZone.on("dragover", function(e) {
        e.preventDefault();
        e.stopPropagation();
      });
      dropZone.on("drop", function(e) {
        e.preventDefault();
        e.stopPropagation();
        dropZone.removeClass("hover");

        const files = e.originalEvent.dataTransfer.files;
        if (files && files.length > 0) {
          selectedFile = files[0];
          dropZone.text("File selezionato: " + selectedFile.name);
        }
      });

      // Apertura del selettore file
      $("#selectFileBtn").click(function() {
        fileInput.click();
      });

      // Quando l'utente seleziona un file via input
      fileInput.change(function(e) {
        if (e.target.files && e.target.files.length > 0) {
          selectedFile = e.target.files[0];
          dropZone.text("File selezionato: " + selectedFile.name);
        }
      });

      // Clic su "Anonimizza"
      $("#anonimizzaBtn").click(async function() {
        if (!selectedFile) {
          alert("Seleziona o trascina un file prima di cliccare Anonimizza.");
          return;
        }

        // Creiamo il FormData con il file
        let formData = new FormData();
        formData.append("file", selectedFile);

        // Inviamo l'AJAX al backend
        try {
          const response = await $.ajax({
            url: "http://localhost:5000/api/anonymize",  // Adatta se la porta è diversa
            method: "POST",
            data: formData,
            contentType: false,
            processData: false,
            dataType: "json" // Riceviamo JSON
          });

          if (response.error) {
            alert("Errore dal server: " + response.error);
            return;
          }

          // response = { anonymized_text, zip_base64 }
          // Mostriamo il testo anonimizzato
          $("#anonText").text(response.anonymized_text);

          // Scarichiamo subito lo zip
          if (response.zip_base64) {
            downloadZip(response.zip_base64);
          }

        } catch (err) {
          console.error("Errore AJAX: ", err);
          alert("Si è verificato un errore durante l'anonimizzazione.");
        }
      });
    });

    function downloadZip(base64Data) {
      const link = document.createElement("a");
      link.href = "data:application/zip;base64," + base64Data;
      link.download = "anonymized_package.zip";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
