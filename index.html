<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anonimizzatore</title>

  <!-- Bootstrap CSS -->
  <link 
    rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  >
  <!-- Il tuo CSS personalizzato -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- NAVBAR in alto -->
  <nav>
    <a href="index.html">Anonymize</a>
    <a href="deanonymize.html">De-anonymize</a>
  </nav>

  <!-- Titolo -->
  <h1 class="text-center my-4">Anonimizzazione</h1>

  <div class="container">
    <!-- Riga con i due blocchi -->
    <div class="row justify-content-center mb-4">
      
      <!-- Colonna sinistra: caricamento file -->
      <div class="col-md-5 d-flex flex-column align-items-center">
        <h3>Carica il File da Anonimizzare</h3>
        
        <!-- Nome file selezionato (aggiornato via JS) -->
        <p id="selectedFileLabel" class="fw-bold mb-2">
          Nessun file selezionato
        </p>

        <!-- Box drag & drop -->
        <div 
          id="dropZone" 
          class="border p-4 mb-3 text-center" 
          style="width: 100%; min-height: 200px;"
        >
          Trascina qui il file da anonimizzare
        </div>

        <p>Oppure</p>

        <!-- Pulsante per selezione file (input nascosto in CSS) -->
        <button 
          id="selectFileBtn" 
          type="button" 
          class="btn btn-primary mb-3"
        >
          Seleziona File...
        </button>

        <!-- Input file nascosto -->
        <input 
          type="file" 
          id="fileInput" 
          accept=".pdf,.docx,.xlsx,.txt"
        />
      </div>

      <!-- Colonna destra: output testo anonimizzato -->
      <div class="col-md-5 d-flex flex-column align-items-center">
        <h3>Testo Anonimizzato:</h3>
        <p id="selectedFileLabel" class="fw-bold mb-2">
          Nessun file selezionato
        </p>
        <div 
          id="anonText" 
          class="border p-3" 
          style="width: 100%; min-height: 200px; white-space: pre-wrap;"
        ></div>
      </div>

    </div><!-- /.row -->

    <!-- Pulsante “Anonimizza” centrato -->
    <div class="row">
      <div class="col-12 text-center">
        <button 
          id="anonimizzaBtn" 
          type="button" 
          class="btn btn-success"
        >
          Anonimizza
        </button>
      </div>
    </div>
  </div><!-- /.container -->

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Bootstrap JS (bundle) -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
  </script>

  <!-- Script di Anonimizzazione (invariato nella logica) -->
  <script>
    let selectedFile = null;

    $(document).ready(function () {
      const dropZone = $("#dropZone");
      const fileInput = $("#fileInput");
      const selectedFileLabel = $("#selectedFileLabel");

      // DRAG & DROP
      dropZone.on("dragenter", function(e) {
        e.preventDefault();
        e.stopPropagation();
        dropZone.addClass("hover");
      });
      dropZone.on("dragleave", function(e) {
        e.preventDefault();
        e.stopPropagation();
        dropZone.removeClass("hover");
      });
      dropZone.on("dragover", function(e) {
        e.preventDefault();
        e.stopPropagation();
      });
      dropZone.on("drop", function(e) {
        e.preventDefault();
        e.stopPropagation();
        dropZone.removeClass("hover");

        const files = e.originalEvent.dataTransfer.files;
        if (files && files.length > 0) {
          selectedFile = files[0];
          selectedFileLabel.text("File selezionato: " + selectedFile.name);
        }
      });

      // Pulsante “Seleziona File...”
      $("#selectFileBtn").click(function() {
        fileInput.click();
      });

      // Cambio file via input
      fileInput.change(function(e) {
        if (e.target.files && e.target.files.length > 0) {
          selectedFile = e.target.files[0];
          selectedFileLabel.text("File selezionato: " + selectedFile.name);
        }
      });

      // Pulsante “Anonimizza”
      $("#anonimizzaBtn").click(async function() {
        if (!selectedFile) {
          alert("Seleziona o trascina un file prima di cliccare Anonimizza.");
          return;
        }

        let formData = new FormData();
        formData.append("file", selectedFile);

        try {
          const response = await $.ajax({
            url: "http://localhost:5000/api/anonymize",
            method: "POST",
            data: formData,
            contentType: false,
            processData: false,
            dataType: "json"
          });

          if (response.error) {
            alert("Errore dal server: " + response.error);
            return;
          }

          // { anonymized_text, zip_base64 }
          $("#anonText").text(response.anonymized_text);

          // Download ZIP se presente
          if (response.zip_base64) {
            downloadZip(response.zip_base64);
          }

        } catch (err) {
          console.error("Errore AJAX:", err);
          alert("Si è verificato un errore durante l'anonimizzazione.");
        }
      });
    });

    function downloadZip(base64Data) {
      const link = document.createElement("a");
      link.href = "data:application/zip;base64," + base64Data;
      link.download = "anonymized_package.zip";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
