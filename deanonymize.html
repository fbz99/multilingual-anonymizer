<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>De-anonymize</title>

  <!-- Bootstrap CSS -->
  <link 
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  >
  
  <!-- Il tuo file CSS (con #fileTextInput, #fileMapInput { display: none; }) -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- NAVBAR in alto -->
  <nav>
    <a href="index.html">Anonymize</a>
    <a href="deanonymize.html">De-anonymize</a>
  </nav>

  <h1 class="text-center my-4">De-anonimizzazione</h1>

  <div class="container">

    <div class="row mb-5">
      <!-- Blocco: Testo Anonimizzato -->
      <div class="col-md-6 text-center">
        <h3>Carica il Testo Anonimizzato</h3>
        
        <!-- Label con il nome del file selezionato -->
        <p id="selectedAnonTextFileLabel" class="fw-bold">Nessun file selezionato</p>

        <!-- Zona drag & drop -->
        <div id="dropZoneText" class="mb-3 border p-3">
          Trascina qui il file di testo anonimizzato
        </div>
        <p>Oppure</p>

        <!-- UN SOLO PULSANTE (stile Bootstrap) + input nascosto -->
        <button 
          id="selectFileTextBtn" 
          type="button" 
          class="btn btn-primary mb-2">
          Seleziona File di Testo...
        </button>

        <input 
          type="file" 
          id="fileTextInput" 
          accept=".pdf,.docx,.xlsx,.txt"
        />
      </div>

      <!-- Blocco: File di Mapping -->
      <div class="col-md-6 text-center">
        <h3>Carica il File di Mapping</h3>

        <p id="selectedMapFileLabel" class="fw-bold">Nessun file selezionato</p>

        <div id="dropZoneMap" class="mb-3 border p-3">
          Trascina qui il file di mapping
        </div>
        <p>Oppure</p>

        <button 
          id="selectFileMapBtn" 
          type="button" 
          class="btn btn-primary mb-2">
          Seleziona File di Mapping...
        </button>

        <input 
          type="file" 
          id="fileMapInput" 
          accept=".zip,.json"
        />
      </div>
    </div>

    <!-- Pulsante DE-ANONIMIZZA -->
    <div class="text-center mb-5">
      <button 
        id="deanonimizzaBtn" 
        type="button" 
        class="btn btn-success"
      >
        De-anonimizza
      </button>
    </div>

    <!-- Output del testo de-anonimizzato -->
    <div class="row">
      <div class="col-12">
        <h3>Testo De-anonimizzato:</h3>
        <div 
          id="deanonText" 
          class="border p-3" 
          style="min-height: 150px; white-space: pre-wrap;"
        ></div>
      </div>
    </div>

  </div><!-- /.container -->

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Bootstrap JS (bundle) -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
  </script>

  <!-- Script per la De-anonimizzazione -->
  <script>
    let selectedAnonTextFile = null;
    let selectedMapFile = null;

    $(document).ready(function () {
      const dropZoneText = $("#dropZoneText");
      const dropZoneMap  = $("#dropZoneMap");
      const fileTextInput = $("#fileTextInput");
      const fileMapInput  = $("#fileMapInput");
      const selectedAnonTextFileLabel = $("#selectedAnonTextFileLabel");
      const selectedMapFileLabel = $("#selectedMapFileLabel");

      // --- Drag & Drop per il file di Testo Anonimizzato ---
      dropZoneText.on("dragenter", function(e) {
        e.preventDefault();
        e.stopPropagation();
        dropZoneText.addClass("hover");
      });
      dropZoneText.on("dragleave", function(e) {
        e.preventDefault();
        e.stopPropagation();
        dropZoneText.removeClass("hover");
      });
      dropZoneText.on("dragover", function(e) {
        e.preventDefault();
        e.stopPropagation();
      });
      dropZoneText.on("drop", function(e) {
        e.preventDefault();
        e.stopPropagation();
        dropZoneText.removeClass("hover");

        const files = e.originalEvent.dataTransfer.files;
        if (files && files.length > 0) {
          selectedAnonTextFile = files[0];
          selectedAnonTextFileLabel.text("File di testo selezionato: " + selectedAnonTextFile.name);
        }
      });

      // --- Drag & Drop per il File di Mapping ---
      dropZoneMap.on("dragenter", function(e) {
        e.preventDefault();
        e.stopPropagation();
        dropZoneMap.addClass("hover");
      });
      dropZoneMap.on("dragleave", function(e) {
        e.preventDefault();
        e.stopPropagation();
        dropZoneMap.removeClass("hover");
      });
      dropZoneMap.on("dragover", function(e) {
        e.preventDefault();
        e.stopPropagation();
      });
      dropZoneMap.on("drop", function(e) {
        e.preventDefault();
        e.stopPropagation();
        dropZoneMap.removeClass("hover");

        const files = e.originalEvent.dataTransfer.files;
        if (files && files.length > 0) {
          selectedMapFile = files[0];
          selectedMapFileLabel.text("File di mapping selezionato: " + selectedMapFile.name);
        }
      });

      // --- Selezione manuale: pulsante "Seleziona File di Testo..." ---
      $("#selectFileTextBtn").click(function() {
        fileTextInput.trigger("click");
      });
      fileTextInput.change(function(e) {
        if (e.target.files && e.target.files.length > 0) {
          selectedAnonTextFile = e.target.files[0];
          selectedAnonTextFileLabel.text("File di testo selezionato: " + selectedAnonTextFile.name);
        }
      });

      // --- Selezione manuale: pulsante "Seleziona File di Mapping..." ---
      $("#selectFileMapBtn").click(function() {
        fileMapInput.trigger("click");
      });
      fileMapInput.change(function(e) {
        if (e.target.files && e.target.files.length > 0) {
          selectedMapFile = e.target.files[0];
          selectedMapFileLabel.text("File di mapping selezionato: " + selectedMapFile.name);
        }
      });

      // --- Clic su "De-anonimizza" ---
      $("#deanonimizzaBtn").click(async function() {
        if (!selectedAnonTextFile || !selectedMapFile) {
          alert("Seleziona (o trascina) sia il file di testo anonimizzato che il file di mapping.");
          return;
        }

        let formData = new FormData();
        // Nomi campi come richiesti dal tuo backend (app.py)
        formData.append("textFile", selectedAnonTextFile);
        formData.append("mappingFile", selectedMapFile);

        try {
          const response = await $.ajax({
            url: "http://localhost:5000/api/deanonymize",
            method: "POST",
            data: formData,
            contentType: false,
            processData: false,
            dataType: "json"
          });

          if (response.error) {
            alert("Errore dal server: " + response.error);
            return;
          }

          // Decodifica il testo de-anonimizzato
          // (chiave: "deanonymized_base64")
          const plainText = atob(response.deanonymized_base64);
          $("#deanonText").text(plainText);

          // Se il server restituisce anche uno zip_base64, lo scarichiamo
          if (response.zip_base64) {
            downloadZip(response.zip_base64);
          }

        } catch (err) {
          console.error("Errore AJAX: ", err);
          alert("Si è verificato un errore durante la de-anonimizzazione.");
        }
      });
    });

    // Funzione per scaricare lo ZIP in Base64
    function downloadZip(base64Data) {
      const link = document.createElement("a");
      link.href = "data:application/zip;base64," + base64Data;
      link.download = "deanonymized_package.zip"; 
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
